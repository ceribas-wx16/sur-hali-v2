<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sur Halı | Yönetim Paneli</title>

    <link
        rel="stylesheet"
        href="admin.css"
    >

</head>

<body>

    <!-- =====================================================
         ADMIN PANEL
    ====================================================== -->

    <div class="admin-container">


        <!-- =================================================
             SOL MENÜ
        ================================================== -->

        <aside class="sidebar">

            <div class="sidebar-header">

                <h1>Sur Halı</h1>

                <p>Yönetim Paneli</p>

            </div>


            <nav class="sidebar-menu">

                <button
                    class="menu-item active"
                    data-page="dashboardPage"
                    type="button"
                >
                    Dashboard
                </button>

                <button
                    class="menu-item"
                    data-page="productsPage"
                    type="button"
                >
                    Ürünler
                </button>

                <button
                    class="menu-item"
                    data-page="imagesPage"
                    type="button"
                >
                    Resimler
                </button>

                <button
                    class="menu-item"
                    data-page="settingsPage"
                    type="button"
                >
                    Site Ayarları
                </button>

                <button
                    class="menu-item"
                    id="logoutButton"
                    type="button"
                >
                    Çıkış Yap
                </button>

            </nav>

        </aside>


        <!-- =================================================
             ANA İÇERİK
        ================================================== -->

        <main class="main-content">


            <!-- =============================================
                 DASHBOARD
            ============================================== -->

            <section
                class="page active-page"
                id="dashboardPage"
            >

                <h2>Dashboard</h2>

                <p>
                    Sur Halı yönetim paneline hoş geldiniz.
                </p>

            </section>


            <!-- =============================================
                 ÜRÜNLER
            ============================================== -->

            <section
                class="page"
                id="productsPage"
            >

                <h2>Ürünler</h2>

                <p>
                    Ürün yönetimi burada olacak.
                </p>

            </section>


            <!-- =============================================
                 RESİMLER
            ============================================== -->

            <section
                class="page"
                id="imagesPage"
            >

                <h2>Resimler</h2>

                <p>
                    Resim yönetimi burada olacak.
                </p>

            </section>


            <!-- =============================================
                 SİTE AYARLARI
            ============================================== -->

            <section
                class="page"
                id="settingsPage"
            >

                <h2>Site Ayarları</h2>

                <p>
                    Site ayarları burada olacak.
                </p>

            </section>


        </main>

    </div>


    <!-- =====================================================
         SUPABASE
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- =====================================================
         SUPABASE BAĞLANTISI
    ====================================================== -->

    <script src="../js/supabase.js"></script>


    <!-- =====================================================
         ADMIN JAVASCRIPT
    ====================================================== -->

    <script src="admin.js"></script>

</body>

</html>
